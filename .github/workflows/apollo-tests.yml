name: Apollo V1.2 recovery tests

on:
  push:
    branches: [main, "test/**", "recovery/**", "feature/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile recovered source
        run: python -m py_compile app.py apollo_v12.py
      - name: Run offline recovery tests
        run: python -m unittest discover -s tests -v
